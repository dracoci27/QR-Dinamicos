<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR 057</title>
</head>
<body>

<p id="mensaje">Redirigiendo...</p>

<script>
    const API = "TU_URL_DE_APPS_SCRIPT";
    const ID = "057";

    fetch(API + "?id=" + ID + "&t=" + Date.now(), {
        cache: "no-store"
    })
    .then(respuesta => respuesta.json())
    .then(datos => {
        if (datos.destino) {
            window.location.replace(datos.destino);
        } else {
            document.getElementById("mensaje").textContent =
                "Este QR todavía no está configurado.";
        }
    })
    .catch(() => {
        document.getElementById("mensaje").textContent =
            "Error al conectar con el servidor.";
    });
</script>

</body>
</html>
