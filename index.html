<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Dinámico</title>
</head>

<body>

    <p id="mensaje">Redirigiendo...</p>

    <script>

        // AQUÍ PONDREMOS LOS DESTINOS
        const destinos = {
            "001": "https://www.google.com",
            "002": "https://www.google.com",
            "003": "https://www.google.com"
        };


        // OBTENER LA RUTA
        const ruta = window.location.pathname;

        // Quitar "/" del principio
        const id = ruta.replace("/", "");


        // BUSCAR DESTINO
        const destino = destinos[id];


        // REDIRIGIR
        if (destino) {

            window.location.href = destino;

        } else {

            document.getElementById("mensaje").textContent =
                "Este QR todavía no está configurado.";

        }

    </script>

</body>
</html>
